# Managed-by: esforzados-legal-preview
# PREVIEW HTTP PÚBLICO: SOLAMENTE archivos estáticos. NUNCA expedientes de clientes.
# Si cambia la IP pública, también debe cambiar este server_name.
server {
    listen 80;
    server_name legal.50.17.162.57.sslip.io;

    root /var/www/legal/current;
    index index.html;
    autoindex off;

    access_log /var/log/nginx/legal-preview.access.log;
    error_log /var/log/nginx/legal-preview.error.log warn;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location ~ /\.(?!well-known/) { return 404; }
    location ~ ^/(src|bin|sql|deploy|tests)(/|$) { return 404; }
    location ~* \.php(?:$|/) { return 404; }

    location / {
        try_files $uri $uri/ =404;
    }
}
